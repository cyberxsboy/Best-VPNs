# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==================== 生成 index.html + meta description + sitemap ====================
      - name: Convert README.md to beautiful index.html
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          
          # 提取标题
          PAGE_TITLE=$(grep -m 1 "^#\{1,2\}\s" README.md | sed 's/^#\+\s*//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | head -c 120)
          if [ -z "$PAGE_TITLE" ]; then
            PAGE_TITLE=$(head -n 15 README.md | grep -m 1 "^# " | sed 's/^# //' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          fi
          if [ -z "$PAGE_TITLE" ]; then
            PAGE_TITLE="我的网站"
          fi
          
          # 提取 Meta Description（取第一个段落，前150字符）
          META_DESC=$(sed '1,/^#/d' README.md | tr '\n' ' ' | sed 's/^[[:space:]]*//' | head -c 150 | sed 's/[[:space:]]*$//' | sed 's/"//g')
          if [ -z "$META_DESC" ]; then
            META_DESC="欢迎访问我的网站 - ${PAGE_TITLE}"
          fi
          
          echo "提取标题: $PAGE_TITLE"
          echo "提取描述: $META_DESC"
          
          cat > index.html << EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <meta name="description" content="${META_DESC}">
              <title>${PAGE_TITLE}</title>
              <style>
                  :root {
                      --accent: #22d3ee;
                      --accent2: #c026d3;
                      --text: #f0f9ff;
                      --text-secondary: #a5b4fc;
                  }
                  
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                      color: var(--text);
                      line-height: 1.8;
                      max-width: 1100px;
                      margin: 0 auto;
                      padding: 50px 20px;
                      min-height: 100vh;
                      position: relative;
                      overflow-x: hidden;
                  }
                  
                  #matrix-bg {
                      position: fixed;
                      top: 0; left: 0; right: 0; bottom: 0;
                      z-index: -2;
                      opacity: 0.75;
                  }
                  
                  header {
                      text-align: center;
                      margin-bottom: 80px;
                      position: relative;
                      z-index: 2;
                  }
                  
                  h1 {
                      font-size: 3.2rem;
                      font-weight: 800;
                      background: linear-gradient(90deg, #e0f2fe, #67e8f9, #bae6fd);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                      text-shadow: 0 0 15px #67e8f9, 0 0 30px rgba(103, 232, 249, 0.5);
                      margin-bottom: 20px;
                  }
                  
                  .glass-card {
                      background: rgba(15, 23, 42, 0.65);
                      backdrop-filter: blur(20px);
                      -webkit-backdrop-filter: blur(20px);
                      border: 1px solid rgba(103, 232, 249, 0.3);
                      border-radius: 24px;
                      padding: 48px;
                      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
                      margin-bottom: 50px;
                      position: relative;
                      z-index: 2;
                  }
                  
                  .content { font-size: 1.16rem; }
                  
                  .content img {
                      max-width: 100% !important;
                      height: auto !important;
                      border-radius: 16px;
                      margin: 32px 0;
                      box-shadow: 0 15px 35px rgba(34, 211, 238, 0.2);
                  }
                  
                  h2 { color: #67e8f9; margin: 60px 0 26px; font-size: 2rem; text-shadow: 0 0 12px #67e8f9; }
                  h3 { color: #c4d0ff; margin: 45px 0 20px; }
                  p { margin-bottom: 26px; color: var(--text-secondary); }
                  
                  a { color: #67e8f9; text-decoration: none; }
                  a:hover { color: #ffffff; text-shadow: 0 0 12px #67e8f9; }
                  
                  @media (max-width: 768px) {
                      body { padding: 35px 16px; }
                      h1 { font-size: 2.45rem; }
                      .glass-card { padding: 32px 22px; }
                  }
              </style>
          </head>
          <body>
              <canvas id="matrix-bg"></canvas>
              
              <header>
                  <h1>${PAGE_TITLE}</h1>
              </header>
              
              <div class="glass-card">
                  <div class="content">
          EOF
          
          pandoc README.md --from gfm --to html -s --section-divs | sed '1,/<\/h1>/d' >> index.html
          
          cat >> index.html << 'JS_EOF'
                  </div>
              </div>
              <script>
                  const canvas = document.getElementById('matrix-bg');
                  const ctx = canvas.getContext('2d');
                  function resizeCanvas() { canvas.height = window.innerHeight; canvas.width = window.innerWidth; }
                  resizeCanvas();
                  window.addEventListener('resize', resizeCanvas);
                  
                  const chars = '01';
                  const fontSize = 14;
                  let columns = canvas.width / fontSize;
                  let drops = Array(Math.floor(columns)).fill(1);
                  
                  function draw() {
                      ctx.fillStyle = 'rgba(5, 5, 15, 0.085)';
                      ctx.fillRect(0, 0, canvas.width, canvas.height);
                      ctx.fillStyle = '#22d3ee';
                      ctx.font = fontSize + 'px monospace';
                      for (let i = 0; i < drops.length; i++) {
                          const text = chars[Math.floor(Math.random() * chars.length)];
                          ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                          drops[i]++;
                      }
                  }
                  setInterval(draw, 35);
              </script>
          </body>
          </html>
          JS_EOF

      # ==================== 生成 sitemap.xml ====================
      - name: Generate sitemap.xml
        run: |
          cat > sitemap.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://$(echo ${{ github.repository }} | sed 's/.*\///').github.io/$(echo ${{ github.repository }} | cut -d'/' -f2)/</loc>
              <lastmod>$(date +%Y-%m-%d)</lastmod>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          EOF

      # ==================== 提交文件到仓库 ====================
      - name: Commit updated files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add index.html sitemap.xml
          git commit -m "chore: auto update index.html and sitemap.xml from README.md" || echo "No changes to commit"
          git push
        continue-on-error: true

      # ==================== 部署到 GitHub Pages ====================
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
