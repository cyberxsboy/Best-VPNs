# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==================== 动态 0/1 数字雨背景 + 炫酷科技风 ====================
      - name: Convert README.md to beautiful index.html
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          
          # 提取标题
          PAGE_TITLE=$(grep -m 1 "^#\{1,2\}\s" README.md | sed 's/^#\+\s*//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | head -c 100)
          if [ -z "$PAGE_TITLE" ]; then
            PAGE_TITLE=$(head -n 10 README.md | grep -m 1 "^# " | sed 's/^# //' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          fi
          if [ -z "$PAGE_TITLE" ]; then
            PAGE_TITLE="我的网站"
          fi
          
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>${PAGE_TITLE}</title>
              <style>
                  :root {
                      --accent: #22d3ee;
                      --accent2: #c026d3;
                      --text: #f0f9ff;
                      --text-secondary: #a5b4fc;
                  }
                  
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                      color: var(--text);
                      line-height: 1.8;
                      max-width: 1100px;
                      margin: 0 auto;
                      padding: 50px 20px;
                      min-height: 100vh;
                      position: relative;
                      overflow-x: hidden;
                  }
                  
                  /* 动态 0/1 数字雨 Canvas */
                  #matrix-bg {
                      position: fixed;
                      top: 0; left: 0; right: 0; bottom: 0;
                      z-index: -2;
                      opacity: 0.75;
                  }
                  
                  header {
                      text-align: center;
                      margin-bottom: 80px;
                      position: relative;
                      z-index: 2;
                  }
                  
                  h1 {
                      font-size: 3.3rem;
                      font-weight: 800;
                      background: linear-gradient(90deg, #e0f2fe, #67e8f9, #bae6fd);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                      text-shadow: 0 0 15px #67e8f9, 0 0 30px rgba(103, 232, 249, 0.5);
                      margin-bottom: 20px;
                  }
                  
                  .glass-card {
                      background: rgba(15, 23, 42, 0.65);
                      backdrop-filter: blur(20px);
                      -webkit-backdrop-filter: blur(20px);
                      border: 1px solid rgba(103, 232, 249, 0.3);
                      border-radius: 24px;
                      padding: 48px;
                      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
                      margin-bottom: 50px;
                      position: relative;
                      z-index: 2;
                  }
                  
                  .content { font-size: 1.16rem; }
                  
                  h2 {
                      color: #67e8f9;
                      margin: 60px 0 26px;
                      font-size: 2rem;
                      text-shadow: 0 0 12px #67e8f9;
                  }
                  
                  h3 { color: #c4d0ff; margin: 45px 0 20px; }
                  p { margin-bottom: 26px; color: var(--text-secondary); }
                  
                  a {
                      color: #67e8f9;
                      text-decoration: none;
                      transition: all 0.3s ease;
                  }
                  a:hover {
                      color: #ffffff;
                      text-shadow: 0 0 12px #67e8f9;
                  }
                  
                  /* 响应式 */
                  @media (max-width: 768px) {
                      body { padding: 35px 16px; }
                      h1 { font-size: 2.45rem; }
                      .glass-card { padding: 32px 22px; }
                  }
              </style>
          </head>
          <body>
              <!-- 动态 0/1 数字雨背景 -->
              <canvas id="matrix-bg"></canvas>
              
              <header>
                  <h1>${PAGE_TITLE}</h1>
              </header>
              
              <div class="glass-card">
                  <div class="content">
          EOF
          
          # 转换 README 内容
          pandoc README.md --from gfm --to html -s --section-divs | \
          sed '1,/<\/h1>/d' >> index.html
          
          # 添加 Matrix 数字雨 JavaScript
          cat >> index.html << 'JS_EOF'
                  </div>
              </div>

              <script>
                  const canvas = document.getElementById('matrix-bg');
                  const ctx = canvas.getContext('2d');
                  
                  function resizeCanvas() {
                      canvas.height = window.innerHeight;
                      canvas.width = window.innerWidth;
                  }
                  
                  resizeCanvas();
                  window.addEventListener('resize', resizeCanvas);
                  
                  const chars = '01';
                  const fontSize = 14;
                  let columns = canvas.width / fontSize;
                  let drops = Array(Math.floor(columns)).fill(1);
                  
                  function draw() {
                      ctx.fillStyle = 'rgba(5, 5, 15, 0.08)';
                      ctx.fillRect(0, 0, canvas.width, canvas.height);
                      
                      ctx.fillStyle = '#22d3ee';
                      ctx.font = fontSize + 'px monospace';
                      
                      for (let i = 0; i < drops.length; i++) {
                          const text = chars[Math.floor(Math.random() * chars.length)];
                          ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                          
                          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                              drops[i] = 0;
                          }
                          drops[i]++;
                      }
                  }
                  
                  setInterval(draw, 35);
              </script>
          </body>
          </html>
          JS_EOF
      # =====================================================================

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
