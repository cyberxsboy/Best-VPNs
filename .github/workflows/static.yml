# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==================== 强化炫酷科技风 + Neon 光影 ====================
      - name: Convert README.md to beautiful index.html
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          
          # 提取标题
          PAGE_TITLE=$(grep -m 1 "^#\{1,2\}\s" README.md | sed 's/^#\+\s*//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | head -c 100)
          if [ -z "$PAGE_TITLE" ]; then
            PAGE_TITLE=$(head -n 10 README.md | grep -m 1 "^# " | sed 's/^# //' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          fi
          if [ -z "$PAGE_TITLE" ]; then
            PAGE_TITLE="我的网站"
          fi
          
          cat > index.html << EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>${PAGE_TITLE}</title>
              <style>
                  :root {
                      --bg: #05050f;
                      --grid: #22d3ee25;
                      --accent: #22d3ee;
                      --accent2: #c026d3;
                      --text: #f0f9ff;
                      --text-secondary: #a5b4fc;
                  }
                  
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                      background: var(--bg);
                      color: var(--text);
                      line-height: 1.8;
                      max-width: 1100px;
                      margin: 0 auto;
                      padding: 50px 20px;
                      min-height: 100vh;
                      position: relative;
                      overflow-x: hidden;
                  }
                  
                  /* 深空网格背景 + 微动画 */
                  body::before {
                      content: '';
                      position: fixed;
                      top: 0; left: 0; right: 0; bottom: 0;
                      background-image: 
                          linear-gradient(var(--grid) 1px, transparent 1px),
                          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
                      background-size: 60px 60px;
                      animation: gridMove 25s linear infinite;
                      z-index: -2;
                      opacity: 0.6;
                  }
                  
                  @keyframes gridMove {
                      0% { background-position: 0 0; }
                      100% { background-position: 60px 60px; }
                  }
                  
                  /* 渐变深空叠加层 */
                  body::after {
                      content: '';
                      position: fixed;
                      top: 0; left: 0; right: 0; bottom: 0;
                      background: radial-gradient(circle at 50% 30%, rgba(34, 211, 238, 0.08), transparent 70%);
                      z-index: -1;
                      pointer-events: none;
                  }
                  
                  header {
                      text-align: center;
                      margin-bottom: 80px;
                  }
                  
                  h1 {
                      font-size: 3.4rem;
                      font-weight: 900;
                      background: linear-gradient(90deg, #67e8f9, #e0abff, #67e8f9);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                      text-shadow: 
                          0 0 20px #67e8f9,
                          0 0 40px #67e8f9,
                          0 0 60px #c026d3;
                      margin-bottom: 20px;
                      letter-spacing: -2px;
                  }
                  
                  .glass-card {
                      background: rgba(15, 23, 42, 0.55);
                      backdrop-filter: blur(20px);
                      -webkit-backdrop-filter: blur(20px);
                      border: 1px solid rgba(103, 232, 249, 0.25);
                      border-radius: 24px;
                      padding: 48px;
                      box-shadow: 
                          0 25px 50px rgba(0, 0, 0, 0.7),
                          0 0 60px rgba(103, 232, 249, 0.15);
                      margin-bottom: 50px;
                      position: relative;
                  }
                  
                  .content {
                      font-size: 1.16rem;
                  }
                  
                  h2 {
                      color: #67e8f9;
                      margin: 60px 0 26px;
                      font-size: 2rem;
                      text-shadow: 0 0 15px #67e8f9;
                  }
                  
                  h3 {
                      color: #c4d0ff;
                      margin: 45px 0 20px;
                  }
                  
                  p { 
                      margin-bottom: 26px; 
                      color: var(--text-secondary);
                  }
                  
                  a {
                      color: #67e8f9;
                      text-decoration: none;
                      transition: all 0.3s ease;
                  }
                  a:hover {
                      color: #ffffff;
                      text-shadow: 0 0 15px #67e8f9;
                  }
                  
                  pre {
                      background: rgba(10, 10, 30, 0.8);
                      backdrop-filter: blur(12px);
                      padding: 28px;
                      border-radius: 18px;
                      border: 1px solid rgba(103, 232, 249, 0.2);
                      overflow-x: auto;
                      margin: 32px 0;
                  }
                  
                  img {
                      max-width: 100%;
                      border-radius: 18px;
                      margin: 35px 0;
                      box-shadow: 0 20px 40px rgba(34, 211, 238, 0.2);
                  }
                  
                  /* 响应式优化 */
                  @media (max-width: 768px) {
                      body { padding: 35px 16px; }
                      h1 { font-size: 2.5rem; }
                      .glass-card { padding: 32px 22px; }
                  }
                  
                  @media (max-width: 480px) {
                      h1 { font-size: 2.15rem; }
                  }
              </style>
          </head>
          <body>
              <header>
                  <h1>${PAGE_TITLE}</h1>
              </header>
              
              <div class="glass-card">
                  <div class="content">
          EOF
          
          # 转换 README 内容（跳过第一个 H1）
          pandoc README.md --from gfm --to html -s --section-divs | \
          sed '1,/<\/h1>/d' >> index.html
          
          echo '</div></div></body></html>' >> index.html
      # =====================================================================

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
