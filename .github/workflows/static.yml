# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==================== 炫酷网络科技风 + 毛玻璃效果 ====================
      - name: Convert README.md to beautiful index.html
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          
          # 提取标题
          PAGE_TITLE=$(grep -m 1 "^#\{1,2\}\s" README.md | sed 's/^#\+\s*//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | head -c 100)
          if [ -z "$PAGE_TITLE" ]; then
            PAGE_TITLE=$(head -n 10 README.md | grep -m 1 "^# " | sed 's/^# //' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          fi
          if [ -z "$PAGE_TITLE" ]; then
            PAGE_TITLE="我的网站"
          fi
          
          cat > index.html << EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>${PAGE_TITLE}</title>
              <style>
                  :root {
                      --bg: #0a0a1f;
                      --glass: rgba(15, 23, 42, 0.65);
                      --accent: #22d3ee;
                      --accent2: #a855f7;
                      --text: #e0f2fe;
                      --text-secondary: #94a3b8;
                  }
                  
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                      background: linear-gradient(135deg, #0a0a1f 0%, #1a1a3a 100%);
                      color: var(--text);
                      line-height: 1.8;
                      max-width: 1100px;
                      margin: 0 auto;
                      padding: 50px 20px;
                      min-height: 100vh;
                      position: relative;
                      overflow-x: hidden;
                  }
                  
                  /* 科技背景网格 */
                  body::before {
                      content: '';
                      position: fixed;
                      top: 0; left: 0; right: 0; bottom: 0;
                      background-image: 
                          linear-gradient(#22d3ee10 1px, transparent 1px),
                          linear-gradient(90deg, #22d3ee10 1px, transparent 1px);
                      background-size: 50px 50px;
                      pointer-events: none;
                      z-index: -1;
                  }
                  
                  header {
                      text-align: center;
                      margin-bottom: 80px;
                  }
                  
                  h1 {
                      font-size: 3.2rem;
                      font-weight: 800;
                      background: linear-gradient(90deg, #67e8f9, #c084fc, #67e8f9);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                      text-shadow: 0 0 40px rgba(103, 232, 249, 0.5);
                      margin-bottom: 16px;
                  }
                  
                  .glass-card {
                      background: var(--glass);
                      backdrop-filter: blur(16px);
                      -webkit-backdrop-filter: blur(16px);
                      border: 1px solid rgba(103, 232, 249, 0.2);
                      border-radius: 20px;
                      padding: 45px;
                      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
                      margin-bottom: 40px;
                  }
                  
                  .content {
                      font-size: 1.15rem;
                  }
                  
                  h2 {
                      color: #67e8f9;
                      margin: 55px 0 25px;
                      font-size: 1.95rem;
                      position: relative;
                  }
                  h2::before {
                      content: '';
                      position: absolute;
                      left: -20px;
                      top: 8px;
                      width: 6px;
                      height: 28px;
                      background: linear-gradient(var(--accent), var(--accent2));
                      border-radius: 3px;
                  }
                  
                  h3 {
                      color: #c4d0ff;
                      margin: 42px 0 18px;
                  }
                  
                  p { margin-bottom: 24px; color: var(--text-secondary); }
                  
                  a {
                      color: var(--accent);
                      text-decoration: none;
                      transition: all 0.3s ease;
                  }
                  a:hover {
                      color: #ffffff;
                      text-shadow: 0 0 12px var(--accent);
                  }
                  
                  pre {
                      background: rgba(15, 23, 42, 0.8);
                      backdrop-filter: blur(10px);
                      padding: 28px;
                      border-radius: 16px;
                      border: 1px solid rgba(103, 232, 249, 0.15);
                      overflow-x: auto;
                      margin: 30px 0;
                  }
                  
                  code {
                      background: rgba(103, 232, 249, 0.1);
                      color: #67e8f9;
                      padding: 4px 10px;
                      border-radius: 6px;
                  }
                  
                  img {
                      max-width: 100%;
                      border-radius: 16px;
                      margin: 32px 0;
                      box-shadow: 0 15px 35px rgba(34, 211, 238, 0.15);
                  }
                  
                  table {
                      width: 100%;
                      border-collapse: collapse;
                      margin: 30px 0;
                      background: rgba(15, 23, 42, 0.6);
                      border-radius: 12px;
                      overflow: hidden;
                  }
                  
                  th, td {
                      padding: 16px 20px;
                      border-bottom: 1px solid rgba(103, 232, 249, 0.1);
                  }
                  
                  th {
                      background: rgba(34, 211, 238, 0.1);
                      color: var(--accent);
                  }
                  
                  /* 响应式 */
                  @media (max-width: 768px) {
                      body { padding: 30px 15px; }
                      h1 { font-size: 2.4rem; }
                      .glass-card { padding: 30px 20px; }
                  }
                  
                  @media (max-width: 480px) {
                      h1 { font-size: 2.1rem; }
                  }
              </style>
          </head>
          <body>
              <header>
                  <h1>${PAGE_TITLE}</h1>
              </header>
              
              <div class="glass-card">
                  <div class="content">
          EOF
          
          # 转换 README 内容
          pandoc README.md --from gfm --to html -s --section-divs | \
          sed '1,/<\/h1>/d' >> index.html
          
          echo '</div></div></body></html>' >> index.html
      # =====================================================================

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
