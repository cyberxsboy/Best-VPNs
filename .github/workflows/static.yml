# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==================== 加强版标题提取 + 美观样式 ====================
      - name: Convert README.md to beautiful index.html
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          
          # 更强大的标题提取（支持各种写法）
          PAGE_TITLE=$(grep -m 1 "^#\{1,2\}\s" README.md | sed 's/^#\+\s*//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | head -c 100)
          
          # 如果还是提取不到，尝试更宽松的方式
          if [ -z "$PAGE_TITLE" ]; then
            PAGE_TITLE=$(head -n 10 README.md | grep -m 1 "^# " | sed 's/^# //' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          fi
          
          # 最终兜底
          if [ -z "$PAGE_TITLE" ]; then
            PAGE_TITLE="我的网站"
          fi
          
          echo "提取到的标题: $PAGE_TITLE"   # 方便你在 Actions 日志中查看
          
          cat > index.html << EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>${PAGE_TITLE}</title>
              <style>
                  :root {
                      --bg: #0f172a;
                      --text: #e2e8f0;
                      --accent: #60a5fa;
                      --card: #1e2937;
                  }
                  
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                      background: var(--bg);
                      color: var(--text);
                      line-height: 1.7;
                      max-width: 1000px;
                      margin: 0 auto;
                      padding: 40px 20px;
                  }
                  
                  header {
                      text-align: center;
                      margin-bottom: 60px;
                      padding-bottom: 40px;
                      border-bottom: 1px solid #334155;
                  }
                  
                  h1 {
                      font-size: 2.8rem;
                      margin-bottom: 16px;
                      background: linear-gradient(90deg, #60a5fa, #a78bfa);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                  }
                  
                  .content { font-size: 1.1rem; }
                  
                  h2 { 
                      color: #93c5fd; 
                      margin: 48px 0 20px;
                      font-size: 1.8rem;
                      border-left: 5px solid var(--accent);
                      padding-left: 16px;
                  }
                  
                  h3 { color: #c4d0e0; margin: 36px 0 16px; }
                  p { margin-bottom: 20px; }
                  
                  code {
                      background: #1e2937;
                      padding: 3px 8px;
                      border-radius: 6px;
                      font-family: 'JetBrains Mono', monospace;
                  }
                  
                  pre {
                      background: #1e2937;
                      padding: 20px;
                      border-radius: 12px;
                      overflow-x: auto;
                      margin: 24px 0;
                      border: 1px solid #334155;
                  }
                  
                  img {
                      max-width: 100%;
                      border-radius: 12px;
                      margin: 24px 0;
                      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                  }
                  
                  table {
                      width: 100%;
                      border-collapse: collapse;
                      margin: 24px 0;
                      background: var(--card);
                      border-radius: 10px;
                      overflow: hidden;
                  }
                  
                  th, td {
                      padding: 14px 16px;
                      text-align: left;
                      border-bottom: 1px solid #334155;
                  }
                  
                  th {
                      background: #1e2937;
                      color: var(--accent);
                  }
                  
                  @media (max-width: 768px) {
                      body { padding: 20px 15px; }
                      h1 { font-size: 2.2rem; }
                  }
              </style>
          </head>
          <body>
              <header>
                  <h1>${PAGE_TITLE}</h1>
              </header>
              <div class="content">
          EOF
          
          # 转换 README 内容并跳过第一个标题
          pandoc README.md --from gfm --to html -s --section-divs | \
          sed '1,/<\/h1>/d' >> index.html
          
          echo '</div></body></html>' >> index.html
      # =====================================================================

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
