# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==================== 高端网络科技风 + 响应式样式 ====================
      - name: Convert README.md to beautiful index.html
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          
          # 提取标题
          PAGE_TITLE=$(grep -m 1 "^#\{1,2\}\s" README.md | sed 's/^#\+\s*//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | head -c 100)
          if [ -z "$PAGE_TITLE" ]; then
            PAGE_TITLE=$(head -n 10 README.md | grep -m 1 "^# " | sed 's/^# //' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          fi
          if [ -z "$PAGE_TITLE" ]; then
            PAGE_TITLE="我的网站"
          fi
          
          cat > index.html << EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>${PAGE_TITLE}</title>
              <style>
                  :root {
                      --bg: #0a0f1c;
                      --surface: #111827;
                      --text: #e2e8f0;
                      --text-secondary: #94a3b8;
                      --accent: #4fd1c5;
                      --accent-soft: #22d3ee;
                  }
                  
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                      background: var(--bg);
                      color: var(--text);
                      line-height: 1.75;
                      max-width: 1080px;
                      margin: 0 auto;
                      padding: 48px 24px;
                  }
                  
                  header {
                      text-align: center;
                      margin-bottom: 70px;
                      padding-bottom: 40px;
                      border-bottom: 1px solid #1e2937;
                  }
                  
                  h1 {
                      font-size: 2.9rem;
                      margin-bottom: 20px;
                      background: linear-gradient(90deg, #67e8f9, #a5f3fc);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                      font-weight: 700;
                  }
                  
                  .content { font-size: 1.12rem; }
                  
                  h2 {
                      color: #67e8f9;
                      margin: 52px 0 24px;
                      font-size: 1.85rem;
                      border-left: 6px solid var(--accent);
                      padding-left: 20px;
                  }
                  
                  h3 {
                      color: #a5b4fc;
                      margin: 40px 0 18px;
                      font-size: 1.35rem;
                  }
                  
                  p { margin-bottom: 22px; color: var(--text-secondary); }
                  
                  a {
                      color: var(--accent-soft);
                      text-decoration: none;
                      transition: all 0.3s ease;
                  }
                  a:hover {
                      color: #67e8f9;
                      text-decoration: underline;
                  }
                  
                  code {
                      background: #1e2937;
                      padding: 4px 9px;
                      border-radius: 6px;
                      font-family: 'JetBrains Mono', monospace;
                      color: #67e8f9;
                  }
                  
                  pre {
                      background: #111827;
                      padding: 24px;
                      border-radius: 14px;
                      overflow-x: auto;
                      margin: 28px 0;
                      border: 1px solid #1e2937;
                  }
                  
                  img {
                      max-width: 100%;
                      border-radius: 14px;
                      margin: 32px 0;
                      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
                  }
                  
                  table {
                      width: 100%;
                      border-collapse: collapse;
                      margin: 32px 0;
                      background: var(--surface);
                      border-radius: 12px;
                      overflow: hidden;
                  }
                  
                  th, td {
                      padding: 16px 20px;
                      text-align: left;
                      border-bottom: 1px solid #1e2937;
                  }
                  
                  th {
                      background: #1e2937;
                      color: var(--accent);
                  }
                  
                  @media (max-width: 768px) {
                      body { padding: 30px 18px; }
                      h1 { font-size: 2.3rem; }
                      h2 { font-size: 1.65rem; }
                  }
                  
                  @media (max-width: 480px) {
                      h1 { font-size: 2.1rem; }
                  }
              </style>
          </head>
          <body>
              <header>
                  <h1>${PAGE_TITLE}</h1>
              </header>
              <div class="content">
          EOF
          
          # 转换 README 内容
          pandoc README.md --from gfm --to html -s --section-divs | \
          sed '1,/<\/h1>/d' >> index.html
          
          echo '</div></body></html>' >> index.html
      # =====================================================================

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
